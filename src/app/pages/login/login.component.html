<div class="login-shell">
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>

  <div class="login-card">
    <div class="brand-row">
      <div class="brand-mark">
        <svg viewBox="0 0 40 40" fill="none" aria-label="TheBrainStak">
          <rect x="5" y="5" width="26" height="22" rx="7" stroke="currentColor" stroke-width="2.2"/>
          <path d="M10 27 L7.5 34 L16 29" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
          <circle cx="13" cy="14" r="2" fill="currentColor"/>
          <circle cx="13" cy="21" r="2" fill="currentColor"/>
          <path d="M18 14H27M18 21H27" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </div>

      <div class="brand-text">
        <span>TheBrainStak</span>
        <small>AI workspace</small>
      </div>
    </div>

    <div class="login-content">
      <div class="pill">Multi-model AI for everyone</div>

      <h1>Welcome back</h1>

      <p>
        Continue to your intelligent workspace and route prompts across the best AI models with ease.
      </p>
    </div>

    <div class="auth-panel">
      <div #gbtn class="g-btn-wrap"></div>

      @if (error()) {
        <div class="err">{{ error() }}</div>
      }
    </div>

    <div class="secure-note">
      <span></span>
      Secure login powered by Google
    </div>

    <p class="legal">
      By continuing, you agree to our terms and privacy policy.
    </p>
  </div>
</div>
